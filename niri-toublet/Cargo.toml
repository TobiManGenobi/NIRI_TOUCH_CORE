# Workspace root for the niri-toublet touch stack.
#
# Deliberately minimal: no `[workspace.package]` / `[workspace.dependencies]`
# inheritance, because `crates/touch-core` already declares its own package
# fields and adding inheritance would make its manifest depend on the
# workspace layout it is supposed to be independent of. Each crate stays
# self-describing.

[workspace]
resolver = "2"
members = ["crates/touch-core", "crates/touch-arbitrate"]
